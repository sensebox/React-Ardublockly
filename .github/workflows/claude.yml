# .github/workflows/claude.yml
# Reagiert auf "@claude" in PR-/Issue-Kommentaren (z. B. "@claude review").
# Authentifizierung per Workload Identity Federation (kein API-Key-Secret).
# IDs als Organisations-Variablen anlegen (Settings → Secrets and variables → Actions → Variables).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # für OIDC-Token (GitHub App + Federation)
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: "--max-turns 20"
          show_full_output: true
